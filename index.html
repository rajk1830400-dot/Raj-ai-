<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raj AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 15px; background: #1e293b; display: flex; align-items: center; gap: 10px; font-weight: bold; border-bottom: 1px solid #334155; }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.4; word-wrap: break-word; }
        .user { background: #2563eb; align-self: flex-end; }
        .ai { background: #1e293b; align-self: flex-start; border: 1px solid #334155; }
        .input-area { padding: 10px; background: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #0f172a; color: #fff; outline: none; }
        button { padding: 12px 20px; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <header>🤖 Raj AI</header>

    <div id="chat-box">
        <div class="msg ai">Namaste! 👋 Main Raj AI hoon. Main aapki kya madad kar sakta hoon?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Raj AI se poochho..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
